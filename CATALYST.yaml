common:
  meta:
    min_ver: "2.1.0"
  manifest:
    name: peerfs
    type: STATICLIB
    version: "0.1.0"
    description: PeerFS control-plane core
    toolchain: toolchains/debug.yaml
    tooling:
      FMT: clang-format-22
      LINTER: clang-tidy-22
    dirs:
      include: [include]
      source: [src/core]
      build: build
  dependencies:
    - name: yaml-cpp
      source: system
  features:
    test_transport: false
  hooks:
    pre-build:
      - script: scripts/verify-toolchain.sh
cli:
  manifest:
    type: BINARY
    dirs:
      source: [src/core, src/live, src/cli]
  dependencies:
    - name: libcurl
      source: system
    - name: fuse3
      source: system
    - name: nlohmann_json
      source: system
live:
  manifest:
    dirs:
      source: [src/core, src/live]
  dependencies:
    - name: libcurl
      source: system
    - name: fuse3
      source: system
    - name: nlohmann_json
      source: system
integration:
  features:
    test_transport: true
test:
  manifest:
    type: BINARY
    dirs:
      source: [src/core, test]
debug:
  manifest:
    toolchain: toolchains/debug.yaml
sanitized-debug:
  manifest:
    toolchain: toolchains/sanitized.yaml
relwithdebinfo:
  manifest:
    toolchain: toolchains/relwithdebinfo.yaml
release:
  manifest:
    toolchain: toolchains/release.yaml
